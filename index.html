<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKRAMUL AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#191f2d;text-align:center;font-size:23px;font-weight:bold;color:#54d6ff}
main{max-width:800px;margin:auto;padding:15px}
#chat{height:65vh;overflow-y:auto;padding:12px;background:#191f2d;border-radius:14px}
.msg{padding:12px 15px;margin:10px 0;border-radius:12px;max-width:90%;line-height:1.5;white-space:pre-wrap}
.user{background:#176b9a;margin-left:auto}
.ai{background:#30394b;margin-right:auto}
.controls{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:10px;background:#252d3d;color:white;font-size:16px}
button{border:0;border-radius:10px;padding:12px 15px;background:#168fc0;color:white;font-weight:bold}
button:disabled{opacity:.5}
.note{text-align:center;color:#aab4c5;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<header>🤖 EKRAMUL AI</header>
<main>
  <div id="chat">
    <div class="msg ai">আসসালামু আলাইকুম! আমি EKRAMUL AI। আমাকে যেকোনো প্রশ্ন করতে পারো। 😊</div>
  </div>
  <div class="controls">
    <input id="message" placeholder="এখানে মেসেজ লেখো..." />
    <button id="send" onclick="sendMessage()">পাঠাও</button>
    <button onclick="voiceInput()">🎤</button>
  </div>
  <div class="note">EKRAMUL AI • Text & Voice Assistant</div>
</main>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const history = [];

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  input.value = "";
  addMessage(text,"user");
  history.push({role:"user",content:text});

  const send = document.getElementById("send");
  send.disabled = true;
  addMessage("উত্তর তৈরি হচ্ছে...","ai");
  const loading = chat.lastChild;

  try{
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history})
    });

    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "সমস্যা হয়েছে");

    loading.textContent = data.reply;
    history.push({role:"assistant",content:data.reply});
  }catch(error){
    loading.textContent = "দুঃখিত! " + error.message;
    history.pop();
  }finally{
    send.disabled = false;
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") sendMessage();
});

function voiceInput(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("তোমার ব্রাউজারে ভয়েস ইনপুট সাপোর্ট করছে না।");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.onresult = e=>{
    input.value = e.results[0][0].transcript;
  };
  recognition.start();
}
</script>
</body>
</html>
